[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-play-recap"
version = "0.1.0"
description = "Build short NBA recaps from play-by-play data and official event clips."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.60.0",
    "tzdata>=2025.2",
]

[project.scripts]
nba-recap = "nba_play_recap.cli:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
